name: Publish birthday site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover previous public quote snapshot
        run: |
          curl --fail --silent --show-error --max-time 15 'https://bhv-gh.github.io/neelesh-birthday/quotes.json' -o /tmp/previous-quotes.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          previous = Path('/tmp/previous-quotes.json')
          if previous.exists():
              try:
                  data = json.loads(previous.read_text())
                  if isinstance(data.get('quotes'), dict) and data['quotes']:
                      Path('quotes.json').write_text(json.dumps(data))
              except (ValueError, AttributeError):
                  pass
          PY
      - name: Refresh public market quotes
        run: python3 scripts/fetch_quotes.py
      - name: Install browser verification tools
        if: github.event_name != 'schedule'
        run: |
          npm install --prefix /tmp/birthday-browser playwright
          /tmp/birthday-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify phone layouts and gift flows
        if: github.event_name != 'schedule'
        env:
          NODE_PATH: /tmp/birthday-browser/node_modules
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/birthday-server.log 2>&1 &
          node scripts/verify.cjs
      - name: Save browser screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: browser-results/
      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          mkdir -p _site
          cp index.html quotes.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
