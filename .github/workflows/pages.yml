name: Publish birthday site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover previous public quote snapshot
        run: |
          curl --fail --silent --show-error --max-time 15 'https://bhv-gh.github.io/neelesh-birthday/quotes.json' -o /tmp/previous-quotes.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          previous = Path('/tmp/previous-quotes.json')
          if previous.exists():
              try:
                  data = json.loads(previous.read_text())
                  if isinstance(data.get('quotes'), dict) and data['quotes']:
                      Path('quotes.json').write_text(json.dumps(data))
              except (ValueError, AttributeError):
                  pass
          PY
      - name: Refresh public market quotes
        run: python3 scripts/fetch_quotes.py
      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          mkdir -p _site
          cp index.html quotes.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
